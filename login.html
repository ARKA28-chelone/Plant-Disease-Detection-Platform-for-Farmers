<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PlantCare ML</title>
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="index.html">🌿 PlantCare ML</a>
      <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#diseases">Plant Diseases</a>
        <a href="index.html#detection">Detection</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="tracker.html">Tracker</a>
        <a href="assistant.html">Assistant</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="panel auth-card">
      <h2 id="authTitle">Welcome back</h2>
      <p class="auth-sub" id="authSub">Log in to save your scans and view your history.</p>

      <div class="auth-tabs">
        <button type="button" class="plant-select-btn active" data-mode="login">Login</button>
        <button type="button" class="plant-select-btn" data-mode="register">Sign up</button>
      </div>

      <form id="authForm" novalidate>
        <div class="field" id="nameField" hidden>
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" placeholder="e.g. Ravi Kumar">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-row">
            <input type="password" id="password" autocomplete="current-password" placeholder="At least 6 characters">
            <button type="button" id="togglePassword" class="link-btn">Show</button>
          </div>
        </div>
        <p id="authError" class="error" role="alert"></p>
        <button type="submit" id="authSubmit" class="btn auth-submit">Login</button>
      </form>

      <p class="note auth-alt"><a href="index.html">Continue without an account →</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>DBMS Project – Plant Disease Detection Using Machine Learning</p>
  </footer>

  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="chat-widget.js"></script>
  <script>
    (function () {
      // Already logged in? Go straight to the app
      if (Auth.getUser()) { window.location.href = "index.html"; return; }

      let mode = new URLSearchParams(location.search).get("mode") === "register" ? "register" : "login";
      const form = document.getElementById("authForm");
      const errorEl = document.getElementById("authError");
      const submitBtn = document.getElementById("authSubmit");
      const pwd = document.getElementById("password");

      function submitLabel() { return mode === "register" ? "Create account" : "Login"; }

      function setMode(m) {
        mode = m;
        const isRegister = m === "register";
        document.querySelectorAll(".auth-tabs button").forEach(function (b) {
          b.classList.toggle("active", b.dataset.mode === m);
        });
        document.getElementById("nameField").hidden = !isRegister;
        document.getElementById("authTitle").textContent = isRegister ? "Create an account" : "Welcome back";
        document.getElementById("authSub").textContent = isRegister
          ? "Sign up to keep a history of every leaf you scan."
          : "Log in to save your scans and view your history.";
        submitBtn.textContent = submitLabel();
        pwd.autocomplete = isRegister ? "new-password" : "current-password";
        errorEl.textContent = "";
      }

      document.querySelectorAll(".auth-tabs button").forEach(function (b) {
        b.addEventListener("click", function () { setMode(b.dataset.mode); });
      });

      document.getElementById("togglePassword").addEventListener("click", function () {
        const show = pwd.type === "password";
        pwd.type = show ? "text" : "password";
        this.textContent = show ? "Hide" : "Show";
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const body = { email: document.getElementById("email").value.trim(), password: pwd.value };
        if (mode === "register") body.name = document.getElementById("name").value.trim();

        // Client-side validation before hitting the server
        if (mode === "register" && !body.name) { errorEl.textContent = "Please enter your name."; return; }
        if (!/^\S+@\S+\.\S+$/.test(body.email)) { errorEl.textContent = "Please enter a valid email."; return; }
        if (body.password.length < 6) { errorEl.textContent = "Password must be at least 6 characters."; return; }

        errorEl.textContent = "";
        submitBtn.disabled = true;
        submitBtn.textContent = "Please wait...";

        Auth.request("/api/" + mode, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        })
          .then(function (data) {
            Auth.save(data.token, data.user);
            window.location.href = "index.html";
          })
          .catch(function (err) { errorEl.textContent = err.message; })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = submitLabel();
          });
      });

      setMode(mode);
    })();
  </script>
</body>
</html>
